<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f2ee; --surface:#fff; --text:#1e1d1b; --muted:#7f7a72; --orange:#d85a30; --orange-light:#fff3ef; --teal:#1d9e75; --teal-bg:#e1f5ee; --font:'Exo 2',sans-serif; --mono:'DM Mono',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; }
  body { font-family:var(--font); background:transparent; color:var(--text); }
  .widget { width:100%; height:100%; background:transparent; padding:16px; overflow:auto; display:grid; gap:12px; }
  .kpi-head { display:grid; grid-template-columns:repeat(3,minmax(140px,1fr)); gap:10px; }
  .tile { background:var(--bg); border-radius:12px; padding:12px; }
  .label { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; }
  .value { margin-top:6px; font-size:18px; font-weight:700; }
  .sub { margin-top:3px; font-size:11px; color:var(--muted); }
  .bars { display:grid; gap:8px; }
  .bar-row { background:var(--bg); border-radius:10px; padding:10px; display:grid; grid-template-columns:140px 1fr 42px; align-items:center; gap:10px; }
  .bar-label { font-size:12px; color:var(--text); }
  .bar-track { height:8px; background:#e8e4dc; border-radius:999px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,#3acfa4,#1d9e75); }
  .bar-pct { font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; }
  .year-list { display:flex; gap:8px; flex-wrap:wrap; }
  .year-chip { padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--orange-light); color:var(--orange); }
  @media (max-width: 760px) { .widget { padding:12px; } .kpi-head { grid-template-columns:1fr; } .bar-row { grid-template-columns:1fr; } .bar-pct { text-align:left; } }
</style>
</head>
<body>
  <section class="widget" aria-label="Employee Performance">
    <div class="kpi-head">
      <div class="tile"><div class="label">Current Rating</div><div class="value" id="perfCurrentRating"></div><div class="sub">Most recent evaluation</div></div>
      <div class="tile"><div class="label">Goals Progress</div><div class="value" id="perfGoalsProgress"></div><div class="sub" id="perfGoalsSub"></div></div>
      <div class="tile"><div class="label">Review Years</div><div class="year-list" id="perfYearList"></div></div>
    </div>
    <div class="bars" id="perfBarList"></div>
  </section>

  <script>
    const mockPerformance = {
      currentRating: 'Exceeds Expectations',
      goalsProgress: '3/4 On Track',
      goalsSub: '75% goals progressing as planned',
      years: ['2025', '2024', '2023', '2022', '2021'],
      kpis: [
        { label: 'Delivery Quality', value: 92 },
        { label: 'Execution Speed', value: 88 },
        { label: 'Collaboration', value: 90 },
        { label: 'Leadership', value: 86 }
      ]
    };

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value || '-';
    }

    function renderPerformance(data) {
      setText('perfCurrentRating', data.currentRating);
      setText('perfGoalsProgress', data.goalsProgress);
      setText('perfGoalsSub', data.goalsSub);

      const yearList = document.getElementById('perfYearList');
      if (yearList) {
        yearList.innerHTML = (data.years || []).map((y) => `<span class="year-chip">${y}</span>`).join('');
      }

      const barList = document.getElementById('perfBarList');
      if (barList) {
        barList.innerHTML = (data.kpis || []).map((k) => `
          <div class="bar-row">
            <div class="bar-label">${k.label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${k.value}%;"></div></div>
            <div class="bar-pct">${k.value}%</div>
          </div>
        `).join('');
      }
    }

    renderPerformance(mockPerformance);
  </script>
</body>
</html>
