<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Compensation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f2ee; --surface:#fff; --text:#1e1d1b; --muted:#7f7a72; --orange:#d85a30; --orange-light:#fff3ef; --green:#3b6d11; --green-bg:#eaf3de; --font:'Exo 2',sans-serif; --mono:'DM Mono',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; }
  body { font-family:var(--font); background:transparent; color:var(--text); }
  .widget { width:100%; height:100%; background:transparent; padding:16px; overflow:auto; display:grid; gap:12px; }
  .summary { display:grid; grid-template-columns:repeat(4,minmax(140px,1fr)); gap:10px; }
  .tile { background:var(--bg); border-radius:12px; padding:12px; }
  .tile-label { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; }
  .tile-value { margin-top:6px; font-size:18px; font-weight:700; }
  .tile-sub { margin-top:3px; font-size:11px; color:var(--muted); }
  .list { display:grid; gap:8px; }
  .row { background:var(--bg); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:80px 1fr 110px; align-items:center; gap:8px; }
  .year { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .bar-wrap { height:8px; background:#ece8df; border-radius:999px; overflow:hidden; }
  .bar { height:100%; background:linear-gradient(90deg,#f4a282,#d85a30); border-radius:999px; }
  .val { text-align:right; font-weight:700; font-size:12px; }
  .growth { margin-top:6px; font-size:11px; color:var(--green); background:var(--green-bg); border-radius:999px; padding:3px 8px; display:inline-flex; }
  @media (max-width: 780px) { .widget { padding:12px; } .summary { grid-template-columns:1fr 1fr; } .row { grid-template-columns:64px 1fr 90px; } }
  @media (max-width: 520px) { .summary { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <section class="widget" aria-label="Employee Compensation">
    <div class="summary">
      <div class="tile"><div class="tile-label">Annual Package</div><div class="tile-value" id="compAnnualPackage"></div><div class="tile-sub">Base + Variable + Benefits</div></div>
      <div class="tile"><div class="tile-label">Next Review</div><div class="tile-value" id="compNextReview"></div><div class="tile-sub">Planned review cycle</div></div>
      <div class="tile"><div class="tile-label">Current View</div><div class="tile-value" id="compViewMode"></div><div class="tile-sub">Current contract package</div></div>
      <div class="tile"><div class="tile-label">YoY Growth</div><div class="tile-value" id="compYoY"></div><div class="tile-sub">Compared to previous year</div></div>
    </div>

    <div class="list" id="compList"></div>
  </section>

  <script>
    const mockComp = {
      annualPackage: '120M VND',
      nextReview: '01/07/2026',
      viewMode: '37M / month',
      yoy: '+9.3%',
      series: [
        { year: '2021', value: 31.2 },
        { year: '2022', value: 34.0 },
        { year: '2023', value: 37.7 },
        { year: '2024', value: 41.2 },
        { year: '2025', value: 44.5 }
      ]
    };

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value || '-';
    }

    function renderComp(data) {
      setText('compAnnualPackage', data.annualPackage);
      setText('compNextReview', data.nextReview);
      setText('compViewMode', data.viewMode);
      setText('compYoY', data.yoy);

      const max = Math.max(...data.series.map((s) => s.value));
      const list = document.getElementById('compList');
      if (!list) return;
      list.innerHTML = data.series.map((s, idx) => {
        const pct = Math.round((s.value / max) * 100);
        const prev = data.series[idx - 1]?.value;
        const growth = prev ? (((s.value - prev) / prev) * 100).toFixed(1) : '0.0';
        return `
          <div class="row">
            <div class="year">${s.year}</div>
            <div>
              <div class="bar-wrap"><div class="bar" style="width:${pct}%;"></div></div>
              ${idx > 0 ? `<span class="growth">+${growth}% YoY</span>` : ''}
            </div>
            <div class="val">${s.value}M</div>
          </div>
        `;
      }).join('');
    }

    renderComp(mockComp);
  </script>
</body>
</html>
