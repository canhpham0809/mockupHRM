<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Contract Information</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #d85a30;
    --orange-light: #fff3ef;
    --bg: #f4f2ee;
    --surface: #ffffff;
    --border: #e8e4dc;
    --border-soft: #f0ede6;
    --text-primary: #1e1d1b;
    --text-secondary: #6b6860;
    --text-muted: #9f998f;
    --green: #3b6d11;
    --green-bg: #eaf3de;
    --blue: #185fa5;
    --blue-bg: #e6f1fb;
    --font: 'Exo 2', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: var(--font);
    color: var(--text-primary);
    background: transparent;
  }

  .contract-widget {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    overflow: auto;
  }

  .card-body {
    padding: 18px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 14px 20px;
  }

  .field-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .field-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    min-height: 18px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .field-val.mono {
    font-family: var(--mono);
    font-weight: 500;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
  }

  .chip.orange {
    background: var(--orange-light);
    color: var(--orange);
  }

  .chip.green {
    background: var(--green-bg);
    color: var(--green);
  }

  .chip.blue {
    background: var(--blue-bg);
    color: var(--blue);
  }

  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .error {
    background: #fee2e2;
    color: #b91c1c;
    padding: 16px;
    border-radius: 8px;
    margin: 16px;
  }

  @media (max-width: 680px) {
    .card-body {
      padding: 14px;
    }

    .field-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
  }
</style>
</head>
<body>
  <section class="contract-widget" aria-label="Employee Contract Information">
    <div class="card-body">
      <div id="loading" class="loading">Loading employee data...</div>
      <div id="error" class="error" style="display:none;"></div>
      
      <div class="field-grid" id="dataContainer" style="display:none;">
        <div><div class="field-label">Legal Entity</div><div class="field-val" id="contractLegalEntity"></div></div>
        <div><div class="field-label">Type</div><div class="chip orange" id="contractType"></div></div>
        <div><div class="field-label">Employee Code</div><div class="field-val mono" id="contractEmployeeCode"></div></div>

        <div><div class="field-label">Employee Type</div><div class="field-val" id="contractEmployeeType"></div></div>
        <div><div class="field-label">Onboarding Date</div><div class="field-val" id="contractOnboardingDate"></div></div>
        <div><div class="field-label">Onboarding End Date</div><div class="field-val" id="contractOnboardingEndDate"></div></div>

        <div><div class="field-label">Gross Salary</div><div class="field-val" id="contractGrossSalary"></div></div>
        <div><div class="field-label">Basic Salary</div><div class="field-val" id="contractBasicSalary"></div></div>
        <div><div class="field-label">VBonus</div><div class="field-val" id="contractVBonus"></div></div>

        <div><div class="field-label">Job Title</div><div class="field-val" id="contractJobTitle"></div></div>
        <div><div class="field-label">Position</div><div class="field-val" id="contractPosition"></div></div>
        <div><div class="field-label">Work Email</div><div class="field-val" id="contractWorkEmail"></div></div>

        <div><div class="field-label">Join Date</div><div class="field-val" id="contractJoinDate"></div></div>
        <div><div class="field-label">End Date</div><div class="field-val" id="contractEndDate"></div></div>
        <div><div class="field-label">Status</div><div class="chip green" id="contractStatus"></div></div>

        <div><div class="field-label">Seniority</div><div class="field-val" id="contractSeniority"></div></div>
        <div><div class="field-label">Employee Class</div><div class="chip blue" id="contractEmployeeClass"></div></div>
        <div><div class="field-label">Contract Type</div><div class="chip blue" id="contractContractType"></div></div>

        <div><div class="field-label">Working Location</div><div class="field-val" id="contractLocation"></div></div>
        <div><div class="field-label">Work Schedule</div><div class="field-val" id="contractWorkSchedule"></div></div>
        <div><div class="field-label">Country</div><div class="field-val" id="contractCountry"></div></div>
      </div>
    </div>
  </section>

  <script>
    var _ctx = null;

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        const date = new Date(dateStr);
        return date.toLocaleDateString('vi-VN');
      } catch (e) {
        return dateStr;
      }
    }

    function getNestedValue(obj, path, fallback = '-') {
      try {
        const value = path.split('.').reduce((current, prop) => current?.[prop], obj);
        if (value && typeof value === 'object' && (value.en || value.vi)) {
          return value.vi || value.en || fallback;
        }
        return (value && String(value).trim()) || fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setText(id, value, fallback = '-') {
      const el = document.getElementById(id);
      if (!el) return;
      const content = String(value || '').trim();
      el.textContent = content || fallback;
    }

    function renderContract(data) {
      // Show data container
      document.getElementById('dataContainer').style.display = 'grid';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'none';

      // Map API response fields to display fields
      setText('contractLegalEntity', getNestedValue(data, 'legalEntityName'));
      setText('contractType', getNestedValue(data, 'contractTypeCode', 'Employment'));
      setText('contractEmployeeCode', data.employeeCode);
      setText('contractEmployeeType', getNestedValue(data, 'employeeTypeCode'));
      setText('contractOnboardingDate', formatDate(data.hireDate));
      setText('contractOnboardingEndDate', '-');

      setText('contractGrossSalary', '-');
      setText('contractBasicSalary', '-');
      setText('contractVBonus', '-');

      setText('contractJobTitle', getNestedValue(data, 'jobTitle'));
      setText('contractPosition', data.positionCode);
      setText('contractWorkEmail', data.email || '-');

      setText('contractJoinDate', formatDate(data.contractStartDate));
      setText('contractEndDate', formatDate(data.contractEndDate) || '-');
      setText('contractStatus', getNestedValue(data, 'statusName'));

      setText('contractSeniority', '-');
      setText('contractEmployeeClass', getNestedValue(data, 'employeeClassName'));
      setText('contractContractType', getNestedValue(data, 'contractTypeName'));

      setText('contractLocation', getNestedValue(data, 'workLocationName'));
      setText('contractWorkSchedule', '-');
      setText('contractCountry', data.legalEntityCountryCode);
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').textContent = message;
      document.getElementById('error').style.display = 'block';
    }

    function fetchEmployeeData(empAggId) {
      if (!empAggId || !_ctx) {
        showError('Missing employee ID or context.');
        return;
      }

      const url = _ctx.urlApi + 'api/v1/core/employee/getByAggId?aggId=' + empAggId;
      
      fetch(url, {
        method: 'GET',
        headers: {
          'Accept': '*/*',
          'AppCode': 'HCM',
          'Authorization': 'Bearer ' + _ctx.jwtToken,
          'Content-Type': 'application/json;charset=UTF-8'
        }
      })
      .then(function(response) {
        if (!response.ok) throw new Error('API Error: ' + response.status);
        return response.json();
      })
      .then(function(result) {
        // Handle response structure: result.data contains the employee object
        const employeeData = result.data || result;
        if (employeeData) {
          renderContract(employeeData);
        } else {
          showError('No employee data received.');
        }
      })
      .catch(function(error) {
        console.error('API Error:', error);
        showError('Failed to load employee data: ' + error.message);
      });
    }

    window.addEventListener('message', function(e) {
      var msg = e.data;
      if (!msg || typeof msg !== 'object') return;

      // Update context
      if (msg._context) {
        _ctx = msg._context;
      }

      // Check if this is a context-only message or has datasource data
      var keys = Object.keys(msg);
      var isContextOnly = keys.length === 1 && keys[0] === '_context';

      if (isContextOnly) {
        // Extract empAggId from dynamic parameters
        var params = _ctx.params || null;
        var empAggId = params && params.empAggId ? params.empAggId : null;
        
        if (empAggId) {
          fetchEmployeeData(empAggId);
        } else {
          showError('No employee ID provided in parameters.');
        }
      } else {
        // Datasource data message - render directly if it contains employee data
        const employeeData = msg.data || msg;
        if (employeeData && employeeData.employeeCode) {
          renderContract(employeeData);
        }
      }
    });
  </script>
</body>
</html>
