        // Mock employee data generator (unchanged)
        function generateMockEmployees(total) {
            const names = ['John Doe', 'Jane Smith', 'Mike Johnson', 'Sarah Wilson', 'David Brown', 'Emily Davis', 'Chris Lee', 'Anna Taylor'];
            const domains = ['HR Governance', 'Finance', 'IT Support', 'Compliance', 'Operations'];
            const titles = ['System Manager', 'Analyst', 'Coordinator', 'Specialist', 'Associate'];
            const types = ['Permanent', 'Contractor'];

            const all = [];
            const permanent = [];
            const contractor = [];

            const numPermanent = Math.floor(total * 0.8);
            const numContractor = total - numPermanent;

            for (let i = 0; i < total; i++) {
                const name = names[Math.floor(Math.random() * names.length)];
                const domain = domains[Math.floor(Math.random() * domains.length)];
                const title = titles[Math.floor(Math.random() * titles.length)];
                const type = i < numPermanent ? 'Permanent' : 'Contractor';
                const employee = { name, domain, title, type };

                all.push(employee);
                if (type === 'Permanent') {
                    permanent.push(employee);
                } else {
                    contractor.push(employee);
                }
            }

            return {
                all,
                permanent,
                contractor,
                counts: { all: total, permanent: numPermanent, contractor: numContractor }
            };
        }

                        <div class="employee-role">${emp.domain} - ${emp.title}</div>
                    </div>
                    <div class="employee-type">${emp.type}</div>
                </div>
            `;
        }
function renderNode(node, level = 0) {
    if (level === 0) return '';
    const hasChildren = node.children && node.children.length > 0;

    // 🎨 Màu sắc theo type
    let borderColor = 'gray-200', hoverColor = 'gray-300';
    if (node.type === 'unit') [borderColor, hoverColor] = ['green-200', 'green-300'];
    else if (node.type === 'dept_group') [borderColor, hoverColor] = ['purple-200', 'purple-300'];
    else if (node.type === 'dept') [borderColor, hoverColor] = ['orange-200', 'orange-300'];
    else if (node.type === 'team') [borderColor, hoverColor] = ['red-200', 'red-300'];

    // 📏 Kích thước giảm dần theo cấp
    let sizeClass = 'p-5 text-base w-64';
    if (node.type === 'dept_group') sizeClass = 'p-4 text-sm w-56';
    else if (node.type === 'dept') sizeClass = 'p-3 text-xs w-48';
    else if (node.type === 'team') sizeClass = 'p-2 text-[11px] w-40';

    // 📐 Khoảng cách giữa node
    const spaceX = level <= 2 ? 'space-x-8' : level === 3 ? 'space-x-4' : 'space-x-2';

    // 🔘 Toggle button
    const hasChildrenBtn = hasChildren
        ? `<button onclick="toggleNode('${node.id}'); event.stopPropagation();"
             class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-5 h-5 
                    bg-${node.type === 'unit' ? 'green' : node.type === 'dept_group' ? 'purple' : node.type === 'dept' ? 'orange' : 'red'}-500 
                    text-white rounded-full shadow hover:shadow-lg z-10">
             <i class="fas fa-minus" id="${node.id.replace('-level', '-toggle')}"></i>
           </button>`
        : '';

    // 🧱 Layout con
    let childrenContainerClass = `flex ${spaceX} flex-wrap hidden`;
    if (node.type === 'unit') {
        if (node.children.length >= 3)
            childrenContainerClass = 'grid grid-cols-3 gap-8 hidden justify-items-center';
        else
            childrenContainerClass = 'flex justify-center gap-8 hidden';
    }

    // 🧩 Thông tin node
    const title = node.name.split(' | ')[1] || node.name;
    const email = node.email || `${node.manager.toLowerCase().replace(/[^a-z0-9]/g, '')}@vng.com`;

    const childrenHtml = hasChildren
        ? `<div class="w-px h-8 bg-gray-300"></div>
           <div id="${node.id}" class="${childrenContainerClass}">
             ${node.children.map(child => `<div class="flex flex-col items-center">${renderNode(child, level + 1)}</div>`).join('')}
           </div>`
        : '';

    // 🧠 Node chính
    return `
        <div class="flex flex-col items-center">
            <div class="org-node bg-white border-2 border-${borderColor} ${sizeClass}
                        rounded-lg shadow-md cursor-pointer relative hover:border-${hoverColor}
                        group overflow-visible"
                 onclick="toggleDetail(this);"
                 data-name="${node.manager}"
                 data-email="${email}"
                 data-title="${title}"
                 data-employees="${node.employees}">
                 
                <div class="text-center">
                    <!-- Name -->
                    <div class="font-semibold text-gray-800 mb-1 truncate max-w-full">${node.name}</div>
                    <!-- Manager -->
                    <div class="text-gray-600 text-xs mb-1 truncate max-w-full">
                        <i class="fas fa-user mr-1"></i>Manager: ${node.manager}
                    </div>
                    <!-- Employees -->
                    <div class="text-gray-600 text-xs">
                        <i class="fas fa-users mr-1"></i>Employees: ${node.employees.toLocaleString()}
                    </div>
                </div>

                <!-- Tooltip hiển thị khi hover -->
                <div class="tooltip hidden absolute z-50 bg-gray-900 text-white p-3 rounded-lg shadow-xl 
                            group-hover:block w-max left-1/2 -translate-x-1/2 -top-24 animate-fadeIn">
                    <div class="text-sm text-left whitespace-nowrap">
                        <div class="font-semibold">${node.manager}</div>
                        <div class="text-gray-300">${email}</div>
                        <div class="text-gray-300">${title}</div>
                    </div>
                </div>

                ${hasChildrenBtn}
            </div>
            ${childrenHtml}
        </div>
    `;
}


        function toggleNode(nodeId) {
            const node = document.getElementById(nodeId);
            const toggleBtn = document.getElementById(nodeId.replace('-level', '-toggle'));
            if (!node || !toggleBtn) return;
            if (node.classList.contains('hidden')) {
                node.classList.remove('hidden');
                toggleBtn.classList.remove('fa-plus');
                toggleBtn.classList.add('fa-minus');
            } else {
                node.classList.add('hidden');
                toggleBtn.classList.remove('fa-minus');
                toggleBtn.classList.add('fa-plus');
            }
        }

        function expandAll() {
            document.querySelectorAll('[id$="-level"]').forEach(el => {
                el.classList.remove('hidden');
                const toggle = document.getElementById(el.id.replace('-level', '-toggle'));
                if (toggle) {
                    toggle.classList.remove('fa-plus');
                    toggle.classList.add('fa-minus');
                }
            });
        }

        function collapseAll() {
            document.querySelectorAll('[id$="-level"]').forEach(el => {
                el.classList.add('hidden');
                const toggle = document.getElementById(el.id.replace('-level', '-toggle'));
                if (toggle) {
                    toggle.classList.remove('fa-minus');
                    toggle.classList.add('fa-plus');
                }
            });
        }

        // Infinite scroll function
        function setupInfiniteScroll(listEl, tabType) {
            listEl.addEventListener('scroll', function () {
                if (listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 10) {
                    const currentLoaded = window.loadedCounts[tabType] || 8;
                    const employees = window.currentEmployees[tabType];
                    if (currentLoaded >= employees.length) return;

                    const nextBatchSize = 20;
                    const nextBatch = employees.slice(currentLoaded, currentLoaded + nextBatchSize);
                    nextBatch.forEach(emp => {
                        listEl.innerHTML += createEmployeeItem(emp);
                    });
                    window.loadedCounts[tabType] = currentLoaded + nextBatch.length;
                }
            });
        }

        function toggleDetail(node) {
            try {
                if (selectedNode && node === selectedNode) {
                    closeDetail();
                    return;
                }
                if (selectedNode) selectedNode.classList.remove('selected');
                selectedNode = node;
                node.classList.add('selected');

                // Show panel with animation
                const detailPanel = document.getElementById('detail-panel');
                const orgMain = document.getElementById('org-chart-main');
                detailPanel.classList.remove('collapsed');
                detailPanel.classList.add('expanded');
                orgMain.classList.add('with-detail');

                const name = node.dataset.name;
                const title = node.dataset.title;
                const totalEmployees = parseInt(node.dataset.employees.replace(/,/g, '')) || 0;
                const mockData = generateMockEmployees(Math.min(totalEmployees, 110));

                const { all, permanent, contractor, counts } = mockData;

                // Set global variables for infinite scroll
                window.currentEmployees = { all, permanent, contractor };
                window.loadedCounts = { all: 8, permanent: 8, contractor: 8 };

                const initialCount = 8;
                const content = `
                    <div class="space-y-6">
                        <div class="detail-section">
                            <div class="detail-label">Manager</div>
                            <div class="detail-value">${name} - ${title}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">Company Group</div>
                            <div class="detail-value">VNG</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">Head Office</div>
                            <div class="detail-value">VNG Campus</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">Country</div>
                            <div class="detail-value">Viet Nam</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">Address</div>
                            <div class="detail-value">Full Address </div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">Total Employee</div>
                            <div class="detail-value">${counts.all.toLocaleString()} employees</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">Employee Type</div>
                            <div class="flex space-x-2 mb-4">
                                <button class="tab-btn active" data-tab="all">All <span class="ml-1 text-xs font-normal">(${counts.all})</span></button>
                                <button class="tab-btn" data-tab="permanent">Permanent <span class="ml-1 text-xs font-normal">(${counts.permanent})</span></button>
                                <button class="tab-btn" data-tab="contractor">Contractor <span class="ml-1 text-xs font-normal">(${counts.contractor})</span></button>
                            </div>
                            <div id="tab-all" class="tab-content active">
                                <input type="text" class="employee-search" placeholder="Search employees..." data-tab="all">
                                <div class="employee-list" data-tab="all">
                                    ${all.slice(0, initialCount).map(emp => createEmployeeItem(emp)).join('')}
                                </div>
                            </div>
                            <div id="tab-permanent" class="tab-content">
                                <input type="text" class="employee-search" placeholder="Search employees..." data-tab="permanent">
                                <div class="employee-list" data-tab="permanent">
                                    ${permanent.slice(0, initialCount).map(emp => createEmployeeItem(emp)).join('')}
                                </div>
                            </div>
                            <div id="tab-contractor" class="tab-content">
                                <input type="text" class="employee-search" placeholder="Search employees..." data-tab="contractor">
                                <div class="employee-list" data-tab="contractor">
                                    ${contractor.slice(0, initialCount).map(emp => createEmployeeItem(emp)).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('detail-content').innerHTML = content;

                // Setup infinite scroll for each list
                setupInfiniteScroll(document.querySelector('[data-tab="all"] .employee-list'), 'all');
                setupInfiniteScroll(document.querySelector('[data-tab="permanent"] .employee-list'), 'permanent');
                setupInfiniteScroll(document.querySelector('[data-tab="contractor"] .employee-list'), 'contractor');

                // Tab switching with event delegation
                const detailContent = document.getElementById('detail-content');
                const handleTabClick = (e) => {
                    if (e.target.classList.contains('tab-btn')) {
                        const tab = e.target.dataset.tab;
                        detailContent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        detailContent.querySelectorAll('.tab-content').forEach(tc => {
                            tc.classList.remove('active');
                            tc.style.display = 'none';
                        });
                        const activeTab = document.getElementById(`tab-${tab}`);
                        if (activeTab) {
                            activeTab.classList.add('active');
                            activeTab.style.display = 'block';
                        }
                        // Reset search and show initial items
                        resetEmployeeSearch();
                    }
                };
                detailContent.addEventListener('click', handleTabClick);
            } catch (error) {
                console.error('Error in toggleDetail:', error);
            }
        }

        function closeDetail() {
            const detailPanel = document.getElementById('detail-panel');
            const orgMain = document.getElementById('org-chart-main');
            detailPanel.classList.add('collapsed');
            detailPanel.classList.remove('expanded');
            orgMain.classList.remove('with-detail');
            if (selectedNode) {
                selectedNode.classList.remove('selected');
                selectedNode = null;
            }
            // Clear globals
            window.currentEmployees = null;
            window.loadedCounts = null;
        }

        // Zoom functions (unchanged)
        function zoomIn() {
            if (currentZoom < 150) {
                currentZoom += 10;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 50) {
                currentZoom -= 10;
                updateZoom();
            }
        }

        function resetZoom() {
            currentZoom = 100;
            updateZoom();
        }

        function updateZoom() {
            const container = document.getElementById('chart-container');
            container.style.transform = `scale(${currentZoom / 100})`;
            document.getElementById('zoom-level').textContent = currentZoom + '%';
        }



        // Level filter (unchanged)
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('level-filter').addEventListener('change', function (e) {
                const selectedLevel = e.target.value;
                const nodes = document.querySelectorAll('.org-node');
                nodes.forEach(node => {
                    const nodeType = node.dataset.title ? node.dataset.title.toLowerCase() : '';
                    if (selectedLevel === 'Org Chart Legal Entity' || nodeType.includes(selectedLevel.toLowerCase())) {
                        node.style.display = 'block';
                    } else {
                        node.style.display = 'none';
                    }
                });
                // Adjust children visibility accordingly
                document.querySelectorAll('[id$="-level"]').forEach(el => el.classList.add('hidden'));
            });
        });

        // Render on load
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('chart-container');
            const childrenHtml = orgData.children.map(child => renderNode(child, 1)).join('');
            container.innerHTML = `
                <div id="comp" class="flex flex-col items-center">
                    <div class="org-node bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6 rounded-xl shadow-lg cursor-pointer relative z-10" 
                         onclick="toggleDetail(this);"
                         data-name="${orgData.manager}" 
                         data-email="${orgData.email}" 
                         data-title="Chief Executive Officer" 
                         data-employees="${orgData.employees}">
                        <div class="text-center">
                            <div class="text-lg font-bold mb-1">${orgData.name}</div>
                            <div class="text-blue-100 text-sm mb-1">
                                <i class="fas fa-user-tie mr-1"></i>Manager: ${orgData.manager}
                            </div>
                            <div class="text-blue-100 text-sm">
                                <i class="fas fa-users mr-1"></i>Employees: ${orgData.employees.toLocaleString()}
                            </div>
                        </div>
                        <button onclick="toggleNode('unit-level'); event.stopPropagation();" class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 w-6 h-6 bg-white text-blue-600 rounded-full shadow-md hover:shadow-lg z-20">
                            <i class="fas fa-minus text-xs" id="comp-toggle"></i>
                        </button>
                    </div>
                </div>
                <div class="flex justify-center">
                    <div class="w-px h-8 bg-gray-300"></div>
                </div>
                <div id="unit-level" class="flex justify-center space-x-4 flex-wrap hidden">
                    ${childrenHtml}
                </div>
            `;

            // Dynamic stats
            function countNodes(data, type) {
                let count = data.type === type ? 1 : 0;
                if (data.children) data.children.forEach(child => count += countNodes(child, type));
                return count;
            }
            //document.getElementById('comp-count').textContent = countNodes(orgData, 'comp');
            //document.getElementById('unit-count').textContent = countNodes(orgData, 'unit');
            //document.getElementById('deptgroup-count').textContent = countNodes(orgData, 'dept_group');
            //document.getElementById('dept-count').textContent = countNodes(orgData, 'dept');
            //document.getElementById('team-count').textContent = countNodes(orgData, 'team');

            // Total employees
            function sumEmployees(data) {
                let sum = data.employees;
                if (data.children) sum += data.children.reduce((acc, child) => acc + sumEmployees(child), 0);
                return sum;
            }
            document.getElementById('total-employees').textContent = `Total Employees: ${sumEmployees(orgData).toLocaleString()}`;

            // Initial state: Collapse all, but ensure COMP is always visible, open UNIT by default
            collapseAll();
            document.getElementById('comp')?.classList.add('hidden');
            document.getElementById('unit-level')?.classList.remove('hidden');
            // Set comp-toggle to minus (expanded)
            const compToggle = document.getElementById('comp-toggle');
            if (compToggle) {
                compToggle.classList.remove('fa-plus');
                compToggle.classList.add('fa-minus');
            }
        });
        // Search functionality
        document.querySelector('input[type="text"]').addEventListener('input', function (e) {
            const searchTerm = e.target.value.toLowerCase();
            const nodes = document.querySelectorAll('.org-node');

            nodes.forEach(node => {
                const text = node.textContent.toLowerCase();
                if (text.includes(searchTerm) || searchTerm === '') {
                    node.style.opacity = '1';
                    node.style.transform = 'scale(1)';
                } else {
                    node.style.opacity = '0.3';
                    node.style.transform = 'scale(0.95)';
                }
            });
        });

        // Initialize tooltips position
        document.addEventListener('DOMContentLoaded', function () {
            const tooltips = document.querySelectorAll('.tooltip');
            tooltips.forEach(tooltip => {
                tooltip.style.position = 'absolute';
                tooltip.style.zIndex = '50';
            });
        });

    </script>
</body>

</html>
