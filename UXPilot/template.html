
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template Builder</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 40px);
        }
        }

        .panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
            font-weight: 600;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .width-control {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .width-control label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            min-width: 50px;
        }

        .width-control input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        .width-control span {
            font-size: 12px;
            color: #64748b;
            min-width: 50px;
            text-align: right;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        #editor {
            height: 100%;
            background: white;
        }

        #preview {
            background: #e5e5e5;
            padding: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 0;
            height: 100%;
            scrollbar-width: thin;
        }

        .preview-frame {
            background: white;
            max-width: 640px;
            margin: 0 auto;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            border-radius: 4px;
            flex-shrink: 0;
            width: 100%;
        }

        .preview-frame p {
            font-family: Segoe UI;
            font-size: 12pt;
            line-height: 1.15;
            color: #000;
            margin: 0 0 8pt 0;
        }

        .preview-frame ul {
            font-family: Segoe UI;
            font-size: 12pt;
            line-height: 1.15;
            color: #000;
            margin: 0 0 8pt 0;
            padding-left: 40px;
        }

        .preview-frame li {
            margin-bottom: 4pt;
        }

        .preview-frame a {
            color: #0563C1;
            text-decoration: underline;
        }

        .preview-frame b, .preview-frame strong {
            font-weight: bold;
        }

        .preview-frame pre {
            font-family: Segoe UI;
            font-size: 12pt;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0 0 8pt 0;
        }

        .btn-copy {
            background: #0078d4;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #106ebe;
        }

        .ql-container {
            font-size: 14px;
        }

        .ql-editor {
            min-height: 400px;
        }

        #preview {
            display: flex;
            justify-content: center;
        }

        .preview-frame {
            width: 100%;
            transition: max-width 0.2s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Editor Panel -->
        <div class="panel">
            <div class="panel-header">
                Visual Editor
            </div>
            <div class="panel-content">
                <div id="editor"></div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>Preview</span>
                <button class="btn-copy" onclick="copyHTML()">Copy HTML</button>
            </div>
            <div class="width-control">
                <label>Width:</label>
                <input type="range" id="widthSlider" min="320" max="1200" value="640" onchange="updatePreviewWidth()">
                <span id="widthDisplay">640px</span>
            </div>
            <div id="preview" class="panel-content"></div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // Initialize Quill Editor
        const quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Soạn nội dung email...',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                    ['link'],
                    ['clean']
                ],
                keyboard: {
                    bindings: {
                        linebreak: {
                            key: 13,
                            shiftKey: false,
                            handler: function(range) {
                                // Insert <br> when Enter is pressed
                                this.quill.insertText(range.index, '\n');
                                this.quill.setSelection(range.index + 1);
                                return false;
                            }
                        },
                        tab: {
                            key: 9,
                            handler: function(range) {
                                // Insert 4 non-breaking spaces when Tab is pressed
                                this.quill.insertText(range.index, '\t');
                                this.quill.setSelection(range.index + 1);
                                return false;
                            }
                        }
                    }
                }
            }
        });

        const previewDiv = document.getElementById('preview');

        // Update preview when content changes
        quill.on('text-change', function() {
            updatePreview();
        });

        function updatePreview() {
            const html = quill.root.innerHTML;
            const width = document.getElementById('widthSlider').value;
            // Convert tab characters to 4 non-breaking spaces for display
            const htmlWithTabs = html.replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;');
            previewDiv.innerHTML = `<div class="preview-frame" style="max-width: ${width}px;">${htmlWithTabs}</div>`;
        }

        function updatePreviewWidth() {
            const width = document.getElementById('widthSlider').value;
            document.getElementById('widthDisplay').textContent = width + 'px';
            updatePreview();
        }

        function copyHTML() {
            const editorHtml = quill.root.innerHTML;
            
            // Build complete HTML document with gray background wrapper
            const completeHtml = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Template</title>
</head>
<body style="
    font-family: Segoe UI, sans-serif;
    font-size: 12pt;
    line-height: 1.15;
    color: #000;
    background: #e5e5e5;
    margin: 0;
    padding: 20px;
">

    <div style="
        background: white;
        max-width: 640px;
        margin: 0 auto;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        border-radius: 4px;
    ">
${formatHtml(editorHtml, 2)}
    </div>

</body>
</html>`;

            navigator.clipboard.writeText(completeHtml).then(() => {
                alert('✓ HTML đã được copy!');
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }

        function formatHtml(html, indent = 0) {
            const indentStr = '    ';
            let result = '';

            // Convert tab characters to 4 non-breaking spaces
            html = html.replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;');

            // Parse HTML and clean it
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;

            // Remove ONLY truly empty <p> tags (not ones with <br>)
            tempDiv.querySelectorAll('p').forEach(p => {
                const hasOnlyBr = p.innerHTML.trim() === '<br>';
                const isEmpty = !p.textContent.trim() && !hasOnlyBr;
                if (isEmpty) {
                    p.remove();
                }
            });

            // Remove empty <ul> tags
            tempDiv.querySelectorAll('ul').forEach(ul => {
                if (!ul.querySelector('li')) {
                    ul.remove();
                }
            });

            // Add inline styles to all elements (removed p margin)
            tempDiv.querySelectorAll('ul').forEach(ul => {
                ul.setAttribute('style', 'margin: 0 0 8pt 0; padding-left: 40px;');
            });

            tempDiv.querySelectorAll('li').forEach(li => {
                li.setAttribute('style', 'margin-bottom: 4pt;');
            });

            tempDiv.querySelectorAll('a').forEach(a => {
                a.setAttribute('style', 'color: #0563C1; text-decoration: underline;');
            });

            function formatNode(node, level) {
                const indentSpace = indentStr.repeat(level);

                if (node.nodeType === 3) { // Text node
                    const text = node.textContent.trim();
                    if (text) {
                        result += indentSpace + text + '\n';
                    }
                } else if (node.nodeType === 1) { // Element node
                    const tag = node.tagName.toLowerCase();
                    const attrs = Array.from(node.attributes)
                        .map(attr => `${attr.name}="${attr.value}"`)
                        .join(' ');

                    const hasChildren = node.childNodes.length > 0;

                    if (hasChildren) {
                        result += indentSpace + `<${tag}${attrs ? ' ' + attrs : ''}>`;
                        
                        // Check if children are all inline
                        const children = Array.from(node.childNodes);
                        let allInline = true;
                        
                        for (let child of children) {
                            if (child.nodeType === 1 && ['P', 'UL', 'OL', 'DIV', 'BLOCKQUOTE'].includes(child.tagName)) {
                                allInline = false;
                                break;
                            }
                        }

                        if (allInline) {
                            result += node.innerHTML + `</${tag}>\n`;
                        } else {
                            result += '\n';
                            children.forEach(child => formatNode(child, level + 1));
                            result += indentSpace + `</${tag}>\n`;
                        }
                    } else {
                        result += indentSpace + `<${tag}${attrs ? ' ' + attrs : ''}></${tag}>\n`;
                    }
                }
            }

            // Add blank line between top-level elements
            const children = Array.from(tempDiv.children);
            children.forEach((node, index) => {
                formatNode(node, indent);
                if (index < children.length - 1) {
                    result += '\n';
                }
            });

            return result.trim();
        }

        // Initialize preview on load
        updatePreview();
    </script>
</body>
</html>
