<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phone Normalize Tool</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input { padding: 8px; margin: 5px 0; width: 300px; }
    button { padding: 10px 15px; }
    .output { margin-top: 15px; font-weight: bold; }
    .error { color: red; }
  </style>
</head>
<body>

<h2>Phone Normalize</h2>

<label>ISD (country code):</label><br>
<input id="isd" placeholder="e.g. 84, +84, 1"><br>

<label>Mobile:</label><br>
<input id="mobile" placeholder="e.g. 0359834812, +84359834812"><br>

<button onclick="process()">Normalize</button>

<div class="output" id="result"></div>

<script>
function clean(input) {
    return input ? input.replace(/[^\d+]/g, '') : '';
}

function normalizeISD(isd) {
    if (!isd) return null;
    let c = clean(isd);

    if (c.startsWith('+')) return c.slice(1);
    if (c.startsWith('00')) return c.slice(2);

    return c;
}

function normalizeFullNumber(full) {
    // FIX 1: remove trunk 0 BEFORE anything
    full = full.replace(/^(\+\d{1,3})0/, '$1');

    // validate
    if (!/^\+[1-9]\d{6,14}$/.test(full)) {
        return { valid: false, error: "Invalid format/length" };
    }

    // FIX 2: detect country code (basic known list)
    const COUNTRY_CODES = ['1','44','84','81','65','90'];

    let cc = null;

    for (let i = 3; i >= 1; i--) {
        let code = full.slice(1, 1 + i);
        if (COUNTRY_CODES.includes(code)) {
            cc = code;
            break;
        }
    }

    if (!cc) {
        return { valid: false, error: "Unknown country code" };
    }

    let national = full.slice(1 + cc.length);

    return {
        valid: true,
        value: `+${cc} ${national}`
    };
}

function mergePhone(isdRaw, mobileRaw, defaultCountry = '84') {
    let isd = normalizeISD(isdRaw);
    let mobile = clean(mobileRaw);

    if (!mobile) {
        return { valid: false, error: "Mobile is required" };
    }

    const COUNTRY_CODES = {
    "1": "US/Canada (NANP)",
    "7": "Russia/Kazakhstan",
    "20": "Egypt",
    "27": "South Africa",
    "30": "Greece",
    "31": "Netherlands",
    "32": "Belgium",
    "33": "France",
    "34": "Spain",
    "36": "Hungary",
    "39": "Italy",
    "40": "Romania",
    "41": "Switzerland",
    "43": "Austria",
    "44": "United Kingdom",
    "45": "Denmark",
    "46": "Sweden",
    "47": "Norway",
    "48": "Poland",
    "49": "Germany",
    "51": "Peru",
    "52": "Mexico",
    "53": "Cuba",
    "54": "Argentina",
    "55": "Brazil",
    "56": "Chile",
    "57": "Colombia",
    "58": "Venezuela",
    "60": "Malaysia",
    "61": "Australia",
    "62": "Indonesia",
    "63": "Philippines",
    "64": "New Zealand",
    "65": "Singapore",
    "66": "Thailand",
    "81": "Japan",
    "82": "South Korea",
    "84": "Vietnam",
    "86": "China",
    "90": "Turkey",
    "91": "India",
    "92": "Pakistan",
    "93": "Afghanistan",
    "94": "Sri Lanka",
    "95": "Myanmar",
    "98": "Iran",
    "211": "South Sudan",
    "212": "Morocco",
    "213": "Algeria",
    "216": "Tunisia",
    "218": "Libya",
    "220": "Gambia",
    "221": "Senegal",
    "222": "Mauritania",
    "223": "Mali",
    "224": "Guinea",
    "225": "Ivory Coast",
    "226": "Burkina Faso",
    "227": "Niger",
    "228": "Togo",
    "229": "Benin",
    "230": "Mauritius",
    "231": "Liberia",
    "232": "Sierra Leone",
    "233": "Ghana",
    "234": "Nigeria",
    "235": "Chad",
    "236": "Central African Republic",
    "237": "Cameroon",
    "238": "Cape Verde",
    "239": "Sao Tome",
    "240": "Equatorial Guinea",
    "241": "Gabon",
    "242": "Congo",
    "243": "DR Congo",
    "244": "Angola",
    "245": "Guinea-Bissau",
    "246": "Diego Garcia",
    "248": "Seychelles",
    "249": "Sudan",}

    const COUNTRY_CODE_PREFIXES = Object.keys(COUNTRY_CODES);

    // Case 1: mobile có +
    if (mobile.startsWith('+')) {
        return normalizeFullNumber(mobile);
    }

    // Case 2: mobile có 00
    if (mobile.startsWith('00')) {
        return normalizeFullNumber('+' + mobile.slice(2));
    }

    // 🔥 FIX: detect implicit country code
    // If the input seems short (common local mobile without leading 0), keep as local.
    // Only treat as international when long enough for a full international number.
    if (mobile.length >= 10) {
        for (let i = 3; i >= 1; i--) {
            let code = mobile.slice(0, i);
            if (COUNTRY_CODE_PREFIXES.includes(code)) {
                // treat as international
                return normalizeFullNumber('+' + mobile);
            }
        }
    }

    // Case 3: local number → dùng ISD hoặc default
    let countryCode = isd || defaultCountry;

    if (mobile.startsWith('0')) {
        mobile = mobile.slice(1);
    }

    let full = `+${countryCode}${mobile}`;

    return normalizeFullNumber(full);
}

function process() {
    let isd = document.getElementById('isd').value;
    let mobile = document.getElementById('mobile').value;

    let result = mergePhone(isd, mobile);

    let output = document.getElementById('result');

    if (!result.valid) {
        output.innerHTML = `<span class="error">Error: ${result.error}</span>`;
    } else {
        output.innerHTML = result.value;
    }
}
</script>

</body>
</html>
